# Build, verify, test and publish the application image.
#
# Runs on every push to main and on every v* tag. The VM never builds the image
# itself: a 4.8 GB multi-stage build wants more RAM than an 8 GB VM has to
# spare while the ERP is running on it, and a build that fails halfway through
# an upgrade leaves the machine with neither the old image nor the new one.
#
# Nothing is published until the image has passed verify-image.sh AND the full
# test suite against a real site. A green build with a red test does not ship.
#
# Tags produced (all point at the same digest):
#   ghcr.io/<owner>/ags-edusmart-erp:sha-<short sha>   every push — immutable
#   ghcr.io/<owner>/ags-edusmart-erp:v1.2.3            on a v1.2.3 tag
#   ghcr.io/<owner>/ags-edusmart-erp:main              moving; for staging only
#
# Deploy the sha- or v- tag. Never deploy :main to production — a moving tag is
# how the ERP silently changes version under an unattended `compose pull`.

name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ags-edusmart-erp

jobs:
  release:
    runs-on: ubuntu-latest
    # Site creation installs six apps; with the build it is close to an hour.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The default runner has ~14 GB free. The builder stage alone is larger
        # than that once the frappe app tree and node_modules are in it.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Build
        run: |
          docker build -f infra/docker/Dockerfile -t ags/edusmart-erp:local .

      - name: Verify the image
        # The 16 checks that catch the failures a green build passes straight
        # through: bench on PATH, git present, node_modules kept, gunicorn run
        # from sites/, every app importable.
        run: bash scripts/verify-image.sh

      - name: Test against a real site
        # Not optional and not a unit-only shortcut. Frappe's UnitTestCase still
        # needs a database — flt(x, precision) reads the rounding method from
        # System Settings and returns 0.0 without one, which turns every money
        # test into a false failure. test-stack.sh runs MariaDB and Redis as
        # containers, creates a site, installs the apps and runs all 56 tests.
        run: bash scripts/test-stack.sh --fresh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          short=$(git rev-parse --short=12 HEAD)
          tags=("${IMAGE}:sha-${short}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags+=("${IMAGE}:${GITHUB_REF#refs/tags/}")
          fi
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("${IMAGE}:main")
          fi
          for t in "${tags[@]}"; do
            docker tag ags/edusmart-erp:local "${t}"
            docker push "${t}"
            echo "pushed ${t}"
          done
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- `%s`\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with: \`AGS_IMAGE=${IMAGE}:sha-${short}\`" >> "$GITHUB_STEP_SUMMARY"
