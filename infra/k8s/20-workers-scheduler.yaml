# Background workers, split by queue, plus the singleton scheduler.
#
# Queue separation (docs/capacity-model.md sec. 4) exists so that the nightly
# reminder ladder over ~6,000 payers cannot starve the short queue that
# user-facing actions depend on.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ags-worker-short
  namespace: ags-erp
  labels: { app: ags-erp, tier: worker, queue: short }
spec:
  replicas: 8
  selector:
    matchLabels: { app: ags-erp, tier: worker, queue: short }
  template:
    metadata:
      labels: { app: ags-erp, tier: worker, queue: short }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      terminationGracePeriodSeconds: 120
      initContainers:
        # Seed the empty volume from the image. See the long note in
        # 05-site-init-job.yaml: sites/ is a PVC mounted over a directory the
        # image is not empty at (apps.txt, and the asset bundles), so an empty
        # volume hides files that are demonstrably present in the image and the
        # pod fails on a first deploy. Mounted elsewhere on purpose — mounting
        # it at sites/ would hide the very files being copied. cp -an never
        # clobbers, so this is a no-op on every deploy after the first.
        - name: seed-sites
          image: ags/edusmart-erp:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -an /home/frappe/frappe-bench/sites/. /mnt/sites/ 2>/dev/null || true"]
          volumeMounts:
            - { name: sites, mountPath: /mnt/sites }
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
      containers:
        - name: worker
          image: ags/edusmart-erp:latest
          args: ["worker"]
          env:
            - { name: WORKER_QUEUE, value: short }
          envFrom:
            - configMapRef: { name: ags-erp-config }
            - secretRef: { name: ags-erp-secrets }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits:   { cpu: "1",    memory: 2Gi }
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: ags-sites }
---
