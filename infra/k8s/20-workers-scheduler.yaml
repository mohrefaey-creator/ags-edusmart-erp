apiVersion: apps/v1
kind: Deployment
metadata:
  name: ags-worker-long
  namespace: ags-erp
  labels: { app: ags-erp, tier: worker, queue: long }
spec:
  replicas: 6
  selector:
    matchLabels: { app: ags-erp, tier: worker, queue: long }
  template:
    metadata:
      labels: { app: ags-erp, tier: worker, queue: long }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      # Long jobs - the reminder ladder, KPI refresh, an invoicing run - get a
      # full hour to finish on drain. They are idempotent, so a kill is safe,
      # but finishing is cheaper than redoing.
      terminationGracePeriodSeconds: 3600
      initContainers:
        # Seed the empty volume from the image. See the long note in
        # 05-site-init-job.yaml: sites/ is a PVC mounted over a directory the
        # image is not empty at (apps.txt, and the asset bundles), so an empty
        # volume hides files that are demonstrably present in the image and the
        # pod fails on a first deploy. Mounted elsewhere on purpose — mounting
        # it at sites/ would hide the very files being copied. cp -an never
        # clobbers, so this is a no-op on every deploy after the first.
        - name: seed-sites
          image: ags/edusmart-erp:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -an /home/frappe/frappe-bench/sites/. /mnt/sites/ 2>/dev/null || true"]
          volumeMounts:
            - { name: sites, mountPath: /mnt/sites }
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
      containers:
        - name: worker
          image: ags/edusmart-erp:latest
          args: ["worker"]
          env:
            - { name: WORKER_QUEUE, value: long }
          envFrom:
            - configMapRef: { name: ags-erp-config }
            - secretRef: { name: ags-erp-secrets }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: ags-sites }
---
# The scheduler. A StatefulSet with replicas: 1 and OrderedReady, NOT a
# Deployment.
#
# A Deployment's rolling update briefly runs two pods. For a scheduler that
# means every scheduled job fires twice during the overlap: two overdue-fee SMS
# to every parent, two late-fee invoices, two KPI refresh passes. The
# application's dedupe keys catch most of it, but the guard is a safety net,
# not a licence to run two.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ags-scheduler
  namespace: ags-erp
  labels: { app: ags-erp, tier: scheduler }
spec:
  serviceName: ags-scheduler
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: { app: ags-erp, tier: scheduler }
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: { app: ags-erp, tier: scheduler }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      terminationGracePeriodSeconds: 60
      initContainers:
        # Seed the empty volume from the image. See the long note in
        # 05-site-init-job.yaml: sites/ is a PVC mounted over a directory the
        # image is not empty at (apps.txt, and the asset bundles), so an empty
        # volume hides files that are demonstrably present in the image and the
        # pod fails on a first deploy. Mounted elsewhere on purpose — mounting
        # it at sites/ would hide the very files being copied. cp -an never
        # clobbers, so this is a no-op on every deploy after the first.
        - name: seed-sites
          image: ags/edusmart-erp:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "cp -an /home/frappe/frappe-bench/sites/. /mnt/sites/ 2>/dev/null || true"]
          volumeMounts:
            - { name: sites, mountPath: /mnt/sites }
          resources:
            requests: { cpu: "50m", memory: 128Mi }
            limits:   { cpu: "500m", memory: 512Mi }
      containers:
        - name: scheduler
          image: ags/edusmart-erp:latest
          args: ["scheduler"]
          envFrom:
            - configMapRef: { name: ags-erp-config }
            - secretRef: { name: ags-erp-secrets }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits:   { cpu: "2",    memory: 4Gi }
          volumeMounts:
            - { name: sites, mountPath: /home/frappe/frappe-bench/sites }
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: ags-sites }
---
apiVersion: v1
kind: Service
metadata:
  name: ags-scheduler
  namespace: ags-erp
spec:
  clusterIP: None
  selector: { app: ags-erp, tier: scheduler }
  ports:
    - { name: none, port: 9999 }
