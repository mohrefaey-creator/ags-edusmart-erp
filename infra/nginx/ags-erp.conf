# nginx front end for AGS EduSmart ERP.
#
# Sized against docs/capacity-model.md: 625 req/s design peak, 2,500 concurrent
# sessions, 07:00-15:00. The job of this tier is to make sure as few of those
# requests as possible reach Python.

# ---------------------------------------------------------------- upstreams
upstream ags_web {
    least_conn;
    # keepalive to the app tier matters more than it looks: without it every
    # request pays a fresh TCP handshake, which at 625 req/s is thousands of
    # sockets per second in TIME_WAIT on the proxy.
    keepalive 64;

    server ags-web-1:8000 max_fails=3 fail_timeout=15s;
    server ags-web-2:8000 max_fails=3 fail_timeout=15s;
    server ags-web-3:8000 max_fails=3 fail_timeout=15s;
    server ags-web-4:8000 max_fails=3 fail_timeout=15s;
    server ags-web-5:8000 max_fails=3 fail_timeout=15s;
    server ags-web-6:8000 max_fails=3 fail_timeout=15s;
}

upstream ags_socketio {
    # Socket.IO needs a stable backend per client across the polling handshake.
    ip_hash;
    server ags-socketio-1:9000;
    server ags-socketio-2:9000;
}

# ------------------------------------------------------------- rate limiting
# Two zones, because these protect different things.
#
# `portal` is generous: a parent legitimately loads several pages in a burst.
# `login` is deliberately harsh - credential stuffing against a school portal is
# the realistic attack, and 5/min per IP is far above what a human needs.
limit_req_zone $binary_remote_addr zone=portal:20m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:20m     rate=50r/s;
limit_conn_zone $binary_remote_addr zone=perip:20m;

# Cache for static assets. Bundles are content-hashed, so this is safe to keep
# for a long time and to serve stale while revalidating.
proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets:100m
                 max_size=10g inactive=7d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Real client IP behind a load balancer, so rate limiting and audit logs are not
# all attributed to the LB.
real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
real_ip_recursive on;

log_format ags_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream":"$upstream_addr",'
    '"cache":"$upstream_cache_status",'
    '"referrer":"$http_referer",'
    '"agent":"$http_user_agent"'
'}';

server {
    listen 80;
    server_name erp.ags.edu.sa;
    # ACME stays on 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.ags.edu.sa;

    access_log /var/log/nginx/ags-access.log ags_json buffer=64k flush=5s;
    error_log  /var/log/nginx/ags-error.log warn;

    ssl_certificate     /etc/letsencrypt/live/erp.ags.edu.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.ags.edu.sa/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Attachments: admission documents, supplier quotations, expense receipts.
    client_max_body_size 50m;
    client_body_buffer_size 256k;
    client_body_timeout 60s;

    limit_conn perip 50;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ------------------------------------------------------------- assets
    # The single biggest lever on this tier. Frappe's bundles are large and
    # content-hashed, so they can be cached hard and never revalidated.
    location /assets/ {
        proxy_pass http://ags_web;
        proxy_cache assets;
        proxy_cache_valid 200 302 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /files/ {
        proxy_pass http://ags_web;
        proxy_cache assets;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    # --------------------------------------------------------------- auth
    location = /api/method/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ags-proxy.conf;
        proxy_pass http://ags_web;
    }

    # ------------------------------------------------------------ realtime
    location /socket.io/ {
        proxy_pass http://ags_socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived: a websocket must not be reaped mid-lesson.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------------- api
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ags-proxy.conf;
        proxy_pass http://ags_web;
    }

    # ------------------------------------------------------------- default
    location / {
        limit_req zone=portal burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/ags-proxy.conf;
        proxy_pass http://ags_web;
    }

    # Health check for the load balancer. Deliberately not rate limited and not
    # logged, or the probe itself becomes the top line in the access log.
    location = /api/method/ping {
        access_log off;
        include /etc/nginx/snippets/ags-proxy.conf;
        proxy_pass http://ags_web;
    }
}
