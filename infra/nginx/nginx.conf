# Top-level nginx tuning for the AGS ERP edge.
user  nginx;
# One worker per core; each handles thousands of the mostly-idle keepalive
# connections that 2,500 open browser sessions produce.
worker_processes auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # 4096 x cores. At the 625 req/s peak the binding constraint is idle
    # keepalive sockets, not request concurrency.
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Browsers hold this open between page loads; 75s covers normal think time
    # without stranding sockets.
    keepalive_timeout 75s;
    keepalive_requests 1000;

    server_tokens off;
    types_hash_max_size 4096;

    # Frappe sets long cookies and Frappe-Site-Name headers.
    large_client_header_buffers 4 16k;

    include /etc/nginx/conf.d/*.conf;
}
