# Shared proxy headers and timeouts for every Frappe upstream location.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Frappe-Site-Name $host;

# 60s covers the slowest legitimate desk operation (a large payroll entry or a
# bulk attendance submit). Anything longer is a job for the background queue,
# not a synchronous request, so failing here is the correct signal.
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

# Retry another worker on connection-level failures only. Retrying a non_idempotent
# request would risk posting a payment twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
