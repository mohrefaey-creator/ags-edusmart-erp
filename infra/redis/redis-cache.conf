# Document and session cache. Losing this costs latency, never data.
port 13000
bind 0.0.0.0
protected-mode yes

maxmemory 4gb
maxmemory-policy allkeys-lru

# No persistence: rebuilding the cache is cheap, and fork-on-save pauses hurt
# more than a cold start does.
save ""
appendonly no

timeout 300
tcp-keepalive 60
tcp-backlog 4096
