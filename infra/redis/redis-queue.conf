# RQ job queues (short / default / long).
port 11000
bind 0.0.0.0
protected-mode yes

maxmemory 2gb

# noeviction is not a preference, it is a correctness requirement.
#
# Under any allkeys-* policy Redis silently discards queued jobs once memory
# fills. Here that means an unsent fee reminder, a lost ZATCA clearance, or an
# invoice that was never generated - with no error raised anywhere. Better to
# refuse the enqueue loudly and let the caller retry.
maxmemory-policy noeviction

# Queues are durable state: an AOF replay after a crash is the difference
# between "the nightly reminder run resumes" and "6,000 parents were skipped".
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 128mb

timeout 0
tcp-keepalive 60
tcp-backlog 4096
