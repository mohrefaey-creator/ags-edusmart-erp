# Realtime pub/sub for the desk and portal.
port 12000
bind 0.0.0.0
# protected-mode no.
#
# Redis denies every non-loopback client when protected mode is on and no
# password is set — `bind 0.0.0.0` does NOT change that, which is the trap here.
# The connection is accepted and then closed with -DENIED, so the client reports
# a broken pipe or "socket closed unexpectedly" rather than anything mentioning
# protected mode. Every worker and socketio crash-looped on it while `redis-cli
# PING` from inside the Redis container answered PONG perfectly.
#
# Turning it off is safe here ONLY because the network boundary is real and
# enforced elsewhere:
#   deploy/compose  the redis services publish no ports, so they are reachable
#                   only from the compose network.
#   infra/k8s       allow-data-from-app restricts tier=redis to the app tiers
#                   and a default-deny covers everything else.
#
# If Redis is ever exposed beyond either boundary, this must become requirepass
# with the password threaded into the redis_* URLs in the site config.
protected-mode no

maxmemory 1gb
maxmemory-policy allkeys-lru
save ""
appendonly no

timeout 0
tcp-keepalive 60
