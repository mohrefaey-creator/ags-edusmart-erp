; The scheduler. EXACTLY ONE of these may run in the whole cluster.
;
; Two schedulers means every scheduled job fires twice. With the reminder ladder
; that is two SMS to every overdue parent; with late fees it is two late-fee
; invoices. The application guards against this with a dedupe key, but the guard
; is a safety net, not a licence to run two.
;
; In Kubernetes this is a StatefulSet with replicas: 1. On VMs, run it on one
; node only and leave this file off the others.

[program:ags-scheduler]
command=/home/frappe/frappe-bench/env/bin/bench schedule
directory=/home/frappe/frappe-bench
user=frappe
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench/logs/scheduler.log
stderr_logfile=/home/frappe/frappe-bench/logs/scheduler.error.log
