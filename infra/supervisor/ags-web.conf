; Supervisor program set for an AGS EduSmart web node (8 vCPU / 16 GB).
;
; Sizing from docs/capacity-model.md sec. 3: 17 gunicorn workers per node
; (2 x cores + 1), six nodes carrying the 625 req/s design peak at ~72%
; utilisation.

[program:ags-web]
; --threads 1 is deliberate. Frappe's ORM keeps per-request state that is not
; thread-safe; threads raise nominal concurrency and then produce cross-request
; data bleed under load. Scale with processes.
command=/home/frappe/frappe-bench/env/bin/gunicorn
    --bind 0.0.0.0:8000
    --workers 17
    --threads 1
    --worker-class sync
    --timeout 120
    --graceful-timeout 30
    ; Recycle workers to bound the slow memory growth Frappe shows over a long
    ; day; the jitter stops all 17 recycling in the same second.
    --max-requests 5000
    --max-requests-jitter 500
    --keep-alive 5
    --preload
    --access-logfile -
    --error-logfile -
    frappe.app:application
directory=/home/frappe/frappe-bench/sites
user=frappe
autostart=true
autorestart=true
startretries=5
stopwaitsecs=40
killasgroup=true
stdout_logfile=/home/frappe/frappe-bench/logs/web.log
stderr_logfile=/home/frappe/frappe-bench/logs/web.error.log

[program:ags-socketio]
command=/usr/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
directory=/home/frappe/frappe-bench
user=frappe
autostart=true
autorestart=true
stdout_logfile=/home/frappe/frappe-bench/logs/socketio.log
stderr_logfile=/home/frappe/frappe-bench/logs/socketio.error.log

[group:ags-web-node]
programs=ags-web,ags-socketio
