; Background worker node. Queue mix from docs/capacity-model.md sec. 4.
;
; The three queues are separated so that a slow `long` job - the nightly
; reminder ladder over 6,000 payers, or a KPI refresh - cannot starve the
; `short` queue that user-facing actions depend on.

[program:ags-worker-short]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue short
directory=/home/frappe/frappe-bench
user=frappe
numprocs=8
process_name=%(program_name)s-%(process_num)d
autostart=true
autorestart=true
stopwaitsecs=1800
killasgroup=true
stdout_logfile=/home/frappe/frappe-bench/logs/worker.log
stderr_logfile=/home/frappe/frappe-bench/logs/worker.error.log

[program:ags-worker-default]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue default
directory=/home/frappe/frappe-bench
user=frappe
numprocs=6
process_name=%(program_name)s-%(process_num)d
autostart=true
autorestart=true
stopwaitsecs=1800
killasgroup=true
stdout_logfile=/home/frappe/frappe-bench/logs/worker.log
stderr_logfile=/home/frappe/frappe-bench/logs/worker.error.log

[program:ags-worker-long]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue long
directory=/home/frappe/frappe-bench
user=frappe
numprocs=6
process_name=%(program_name)s-%(process_num)d
autostart=true
autorestart=true
; Long jobs must be allowed to finish on deploy. Killing the reminder ladder
; mid-run is safe (it is idempotent) but wasteful; killing an invoicing run
; mid-batch leaves work for the next pass.
stopwaitsecs=3600
killasgroup=true
stdout_logfile=/home/frappe/frappe-bench/logs/worker.log
stderr_logfile=/home/frappe/frappe-bench/logs/worker.error.log

[group:ags-workers]
programs=ags-worker-short,ags-worker-default,ags-worker-long
